name: Build CosmicFresh Kernel

on:
  workflow_dispatch:
    inputs:
      toolchain:
        description: "Toolchain (1=GCC, 2=Neutron Clang)"
        required: true
        default: "2"
        type: choice
        options:
          - "1"
          - "2"
      kernel_version:
        description: "Versão do Kernel (KV)"
        required: true
        default: "1"
      fp_model:
        description: "Sensor de digital"
        required: true
        default: "FPC"
        type: choice
        options:
          - "FPC"
          - "EGIS"
      enable_ksu:
        description: "Integrar KernelSU-Next?"
        required: true
        default: "false"
        type: boolean
      avg_build_minutes:
        description: "Tempo médio de build em minutos (só pra calibrar a barra de progresso)"
        required: true
        default: "25"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout do kernel
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Limpar KernelSU-Next antigo
        run: |
          if [ -d "KernelSU-Next" ]; then
            find KernelSU-Next -name ".git" -exec rm -rf {} + 2>/dev/null || true
            chmod -R u+w KernelSU-Next 2>/dev/null || true
            rm -rf KernelSU-Next || sudo rm -rf KernelSU-Next
          fi

      - name: Configurar KernelSU-Next
        run: |
          DEFCONFIG="arch/arm64/configs/odessa_defconfig"

          if [ "${{ inputs.enable_ksu }}" = "true" ]; then
            echo "I: Integrando KernelSU-Next (legacy)..."
            curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

            if [ -f "$DEFCONFIG" ]; then
              sed -i '/CONFIG_KSU/d' "$DEFCONFIG"
              echo "CONFIG_KSU=y" >> "$DEFCONFIG"
              echo "I: CONFIG_KSU=y adicionado em $DEFCONFIG"
            else
              echo "W: $DEFCONFIG não encontrado, não foi possível setar CONFIG_KSU=y"
            fi
          else
            echo "I: KSU desabilitado, removendo CONFIG_KSU de $DEFCONFIG..."
            if [ -f "$DEFCONFIG" ]; then
              sed -i '/CONFIG_KSU/d' "$DEFCONFIG"
              echo "# CONFIG_KSU is not set" >> "$DEFCONFIG"
              echo "I: CONFIG_KSU desativado em $DEFCONFIG"
            else
              echo "W: $DEFCONFIG não encontrado, nada a desativar"
            fi
          fi

      - name: Avisar início da build no Telegram
        id: notify_start
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          TOOLCHAIN_NAME="GCC"
          if [ "${{ inputs.toolchain }}" = "2" ]; then
            TOOLCHAIN_NAME="Neutron Clang"
          fi

          KSU_WANTED="Desativado"
          if [ "${{ inputs.enable_ksu }}" = "true" ]; then
            KSU_WANTED="Ativado (KernelSU-Next)"
          fi

          TEXT="🚀 *Build iniciada — CosmicFresh Kernel*
          Device: odessa
          Versão: R${{ inputs.kernel_version }}
          Toolchain selecionada: $TOOLCHAIN_NAME
          FP Model: ${{ inputs.fp_model }}
          KernelSU: $KSU_WANTED
          Disparado por: ${{ github.actor }}
          Branch/Ref: ${{ github.ref_name }}
          Commit: ${{ github.sha }}

          ░░░░░░░░░░░░░░░░░░░░ 0%
          ⏳ Aguardando início da compilação..."

          RESPONSE=$(curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d parse_mode="Markdown" \
            --data-urlencode text="$TEXT")

          MSG_ID=$(echo "$RESPONSE" | jq -r '.result.message_id // empty')
          echo "tg_message_id=$MSG_ID" >> "$GITHUB_OUTPUT"

      - name: Instalar dependências
        run: |
          chmod +x setupbuild.sh
          ./setupbuild.sh

      - name: Dar permissão de execução ao build.sh
        run: chmod +x build.sh

      - name: Buildar kernel (com progresso no Telegram)
        id: build
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MSG_ID: ${{ steps.notify_start.outputs.tg_message_id }}
          AVG_MINUTES: ${{ inputs.avg_build_minutes }}
        run: |
          chmod +x build.sh

          FP_ARG=""
          if [ "${{ inputs.fp_model }}" = "EGIS" ]; then
            FP_ARG="EGIS"
          fi

          START_TIME=$(date +%s)
          AVG_SECONDS=$((AVG_MINUTES * 60))

          # FIFO pra alimentar o build.sh interativo sem bloquear o background
          mkfifo build_input.fifo
          ( printf "%s\n%s\n" "${{ inputs.toolchain }}" "${{ inputs.kernel_version }}" > build_input.fifo ) &

          set +e
          ./build.sh $FP_ARG < build_input.fifo > build_output.log 2>&1 &
          BUILD_PID=$!
          set -e

          # ---- Loop de progresso ----
          update_telegram() {
            local percent="$1"
            local status_line="$2"

            local now elapsed elapsed_fmt filled empty bar
            now=$(date +%s)
            elapsed=$((now - START_TIME))
            elapsed_fmt=$(printf '%02dm%02ds' $((elapsed/60)) $((elapsed%60)))

            filled=$((percent / 5))
            empty=$((20 - filled))
            bar=$(printf '▓%.0s' $(seq 1 $filled) 2>/dev/null)
            bar+=$(printf '░%.0s' $(seq 1 $empty) 2>/dev/null)

            local text="🔧 Build em andamento — CosmicFresh Kernel (R${{ inputs.kernel_version }})

          ${bar} ${percent}%
          ⏱ Tempo decorrido: ${elapsed_fmt}
          📄 ${status_line}"

            [ -n "$MSG_ID" ] && curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/editMessageText" \
              -d chat_id="$CHAT_ID" \
              -d message_id="$MSG_ID" \
              --data-urlencode text="$text" > /dev/null || true
          }

          while kill -0 "$BUILD_PID" 2>/dev/null; do
            sleep 20

            NOW=$(date +%s)
            ELAPSED=$((NOW - START_TIME))

            # progresso assintótico: sobe rápido no início, desacelera, trava em 90%
            # até o build terminar de verdade (evita "mentir" que chegou a 100% antes da hora)
            PERCENT=$(python3 -c "
          import math
          elapsed = $ELAPSED
          avg = $AVG_SECONDS
          p = 90 * (1 - math.exp(-elapsed/avg))
          print(int(min(90, p)))
          ")

            LAST_LINE=$(tail -n 5 build_output.log 2>/dev/null | grep -v '^\s*$' | tail -n 1 | tr -d '\r' | cut -c1-90)
            [ -z "$LAST_LINE" ] && LAST_LINE="Compilando..."

            update_telegram "$PERCENT" "$LAST_LINE"
          done

          wait "$BUILD_PID"
          BUILD_EXIT=$?

          END_TIME=$(date +%s)
          BUILD_SECONDS=$((END_TIME - START_TIME))
          BUILD_TIME_FMT=$(printf '%02dm%02ds' $((BUILD_SECONDS/60)) $((BUILD_SECONDS%60)))

          echo "build_time=$BUILD_TIME_FMT" >> "$GITHUB_OUTPUT"
          echo "build_exit=$BUILD_EXIT" >> "$GITHUB_OUTPUT"

          if [ "$BUILD_EXIT" -eq 0 ]; then
            update_telegram 100 "✅ Compilação finalizada, preparando pacote..."
          else
            update_telegram "$PERCENT" "❌ Build falhou (exit $BUILD_EXIT), veja o log."
          fi

          # Descobre qual clang/toolchain foi de fato usado, lendo o log
          if grep -q "clang -> " build_output.log; then
            CLANG_PATH=$(grep "clang -> " build_output.log | tail -1 | sed 's/.*clang -> //')
            if [ -x "$CLANG_PATH" ]; then
              CLANG_VER=$("$CLANG_PATH" --version | head -1 | grep -oP '(?<=clang version )[0-9]+(\.[0-9]+)*' || true)
            fi
            if [ -n "$CLANG_VER" ]; then
              CLANG_USED="Neutron Clang $CLANG_VER"
            else
              CLANG_USED="Neutron Clang"
            fi
          elif grep -q "GCC encontrado" build_output.log; then
            CLANG_USED="GCC (KenHV gcc-arm64/gcc-arm)"
          else
            CLANG_USED="Não identificado (ver log)"
          fi
          echo "clang_used=$CLANG_USED" >> "$GITHUB_OUTPUT"

          # Verifica se o kernel tem KernelSU integrado
          KSU_STATUS="Desativado"
          if [ -d "KernelSU-Next" ] || [ -d "KernelSU" ] || [ -d "drivers/kernelsu" ]; then
            if grep -q "^CONFIG_KSU=y" arch/arm64/configs/odessa_defconfig 2>/dev/null; then
              KSU_STATUS="Ativado (KernelSU-Next)"
            else
              KSU_STATUS="Fonte presente, mas CONFIG_KSU não está ativo"
            fi
          fi
          echo "ksu_status=$KSU_STATUS" >> "$GITHUB_OUTPUT"

          if [ "$BUILD_EXIT" -ne 0 ]; then
            echo "Build falhou, veja build_output.log"
            exit "$BUILD_EXIT"
          fi

      - name: Localizar zip gerado
        id: findzip
        if: always()
        run: |
          ZIP_PATH=$(find CosmicFresh -maxdepth 1 -name "CosmicFresh-*.zip" | head -1 || true)
          echo "zip_path=$ZIP_PATH" >> "$GITHUB_OUTPUT"

      - name: Enviar zip para o Telegram
        if: ${{ steps.findzip.outputs.zip_path != '' }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          CAPTION="🛠 *CosmicFresh Kernel Build*
          Device: odessa
          Versão: R${{ inputs.kernel_version }}
          Toolchain: ${{ steps.build.outputs.clang_used }}
          FP Model: ${{ inputs.fp_model }}
          Tempo de build: ${{ steps.build.outputs.build_time }}
          KernelSU: ${{ steps.build.outputs.ksu_status }}"

          curl -s -F document=@"${{ steps.findzip.outputs.zip_path }}" \
            -F chat_id="$CHAT_ID" \
            -F parse_mode="Markdown" \
            -F caption="$CAPTION" \
            "https://api.telegram.org/bot$BOT_TOKEN/sendDocument"

      - name: Avisar falha no Telegram
        if: ${{ failure() }}
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot$BOT_TOKEN/sendMessage" \
            -d chat_id="$CHAT_ID" \
            -d text="❌ Build do CosmicFresh Kernel (R${{ inputs.kernel_version }}) falhou. Confira o log no Actions."

      - name: Upload do log como artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build_output.log
